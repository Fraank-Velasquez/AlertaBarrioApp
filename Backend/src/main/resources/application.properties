spring.application.name=AlertaBarrioApp
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alerta_barrio_db}
spring.datasource.username=${DB_USERNAME:fvelasquezl}
spring.datasource.password=${DB_PASSWORD:140120}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}

# JWT
app.jwt.secret=${JWT_SECRET:alertabarrio-secret-key-change-in-production-very-long-secure}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8080}
