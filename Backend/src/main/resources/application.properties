spring.application.name=alertaBarrio
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alerta_barrio_db}
spring.datasource.username=postgres
spring.datasource.password=72803615
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Crea y actualiza las tablas a partir de las entidades sin borrar datos existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
